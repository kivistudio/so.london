name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

# Only one concurrent deploy at a time; cancel any in-progress run if a new
# commit lands while we're still uploading.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Official Astro action: sets up Node + pnpm, runs `astro build`, and
      # uploads dist/ as the Pages artifact. It auto-detects pnpm from the
      # lockfile and honours the "packageManager" field in package.json.
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          PUBLIC_SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
